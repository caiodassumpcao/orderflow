# Configuração base (produção). Sem valores default para credenciais ou endpoints:
# a aplicação falha na subida se as variáveis de ambiente obrigatórias não existirem.
spring:
  application:
    name: orderflow
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # O seed de estoque de dev é uma migration repetível (db/dev-data). Um banco de dev seedado
    # continua válido para a imagem de produção, que não tem essa pasta. Versionadas ausentes
    # seguem falhando a validação.
    ignore-migration-patterns: "repeatable:missing"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Confirmação de todas as réplicas e produtor idempotente: sem perda nem reordenação por
      # partição quando o cliente reenvia sozinho.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Com o broker fora do ar o relay desiste rápido; o evento fica pendente na outbox.
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 25000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        allow.auto.create.topics: false
    listener:
      # Offset confirmado mensagem a mensagem, depois do processamento.
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

orderflow:
  messaging:
    relay:
      enabled: true
      interval: 500ms
      batch-size: 100
    topics:
      partitions: 3
      # Sem padrão: em produção use 3 (ou o número de brokers); dev e testes usam 1.
      replication-factor: ${KAFKA_REPLICATION_FACTOR}
    retry:
      attempts: 4
      initial-delay-ms: 1000
      multiplier: 2.0
      max-delay-ms: 10000
  security:
    # Libera /actuator/health e Swagger sem autenticação. Ligado apenas no perfil dev.
    dev-endpoints-public: false
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
