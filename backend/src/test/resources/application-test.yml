# Perfil de testes. O datasource vem do Testcontainers (@ServiceConnection).
spring:
  # Kafka e PostgreSQL vêm do Testcontainers (@ServiceConnection).
  security:
    oauth2:
      resourceserver:
        jwt:
          # Resolvido de forma lazy; os testes usam tokens mockados (jwt() do spring-security-test).
          issuer-uri: http://localhost:65535/realms/test

orderflow:
  messaging:
    relay:
      # Ligado só nos testes de mensageria, para não disputar a outbox com os demais testes.
      enabled: false
    topics:
      replication-factor: 1
    retry:
      attempts: 3
      initial-delay-ms: 200
      multiplier: 2.0
      max-delay-ms: 1000
  security:
    dev-endpoints-public: false
    cors:
      allowed-origins: http://localhost:4200
