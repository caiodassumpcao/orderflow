name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.2

jobs:
  backend:
    name: Backend (build, testes, lint, cobertura)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = unit + integração (Testcontainers) + ArchUnit + JaCoCo + Spotless + Checkstyle
      - run: ./mvnw -B -ntp verify
      - name: Relatórios de teste e cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Fluxos críticos sem nada simulado: login no Keycloak, API com Postgres e Kafka (saga e projeção)
  # e a imagem nginx de produção servindo a SPA. Os e2e do job anterior simulam IdP e API.
  e2e-stack:
    name: E2E na stack real (Keycloak, API, Kafka)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gerar .env com senhas aleatórias
        run: |
          cp .env.example .env
          for var in POSTGRES_PASSWORD KEYCLOAK_ADMIN_PASSWORD ORDERFLOW_DEV_USER_PASSWORD ORDERFLOW_DEV_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            sed -i "s|^${var}=.*|${var}=${value}|" .env
          done
      - name: Subir Postgres, Kafka e Keycloak
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait postgres kafka keycloak
      - name: Empacotar a API
        working-directory: backend
        run: ./mvnw -B -ntp -q package -DskipTests
      - name: Subir a API (perfil dev, com o estoque de demonstração)
        run: |
          set -a; . ./.env; set +a
          nohup java -jar backend/target/orderflow-*.jar --spring.profiles.active=dev > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 100 api.log
          exit 1
      - name: Subir a SPA (imagem nginx de produção)
        run: |
          docker build -t orderflow-web:e2e frontend
          docker run -d --name orderflow-web -p 127.0.0.1:4200:8080 orderflow-web:e2e
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4200/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:stack
        working-directory: frontend
      - name: Logs e relatório do Playwright
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-stack-logs
          cp api.log e2e-stack-logs/ || true
          docker compose --env-file .env -f infra/docker-compose.yml logs --no-color > e2e-stack-logs/infra.log || true
          docker logs orderflow-web > e2e-stack-logs/web.log 2>&1 || true
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-report
          path: |
            frontend/playwright-report-stack/
            e2e-stack-logs/
          retention-days: 7

  images:
    name: Imagem ${{ matrix.image }} (build + Trivy)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orderflow-api
            context: backend
          - image: orderflow-web
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          tags: ${{ matrix.image }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Segurança (gitleaks + Trivy fs/config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (segredos no histórico)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O Trivy resolve o pom.xml pelo ~/.m2; sem cache ele consulta o Maven Central e leva 429
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Popular o cache Maven
        working-directory: backend
        run: ./mvnw -B -ntp -q dependency:go-offline
      - name: Trivy (dependências e configuração do repositório)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
